plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soyunomas.wifianalyzer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soyunomas.wifianalyzer'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '3.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
