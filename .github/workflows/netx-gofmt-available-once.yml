name: netx one-shot gofmt available

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netx-gofmt-available-once.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format available.go
        run: |
          gofmt -w REDES/netx/internal/advanced/available.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add REDES/netx/internal/advanced/available.go
          git commit -m "NetX: formatear regla de available bandwidth"
          git push origin HEAD:main
