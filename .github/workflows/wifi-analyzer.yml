name: Build WiFi Analyzer APK

on:
  push:
    branches: [main]
    paths:
      - 'WifiAnalyzer-Android/**'
      - '.github/workflows/wifi-analyzer.yml'
  pull_request:
    paths:
      - 'WifiAnalyzer-Android/**'
      - '.github/workflows/wifi-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Update offline IEEE MAC-vendor database
        run: python3 WifiAnalyzer-Android/scripts/update_oui.py
      - name: Unit tests and debug APK
        working-directory: WifiAnalyzer-Android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Validate APK ZIP
        run: unzip -t WifiAnalyzer-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetScope-v2.4-debug
          path: WifiAnalyzer-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK to repository
        if: github.event_name == 'push'
        run: |
          cp WifiAnalyzer-Android/app/build/outputs/apk/debug/app-debug.apk WifiAnalyzer-Android/NetScope_v2.4.apk
          sha256sum WifiAnalyzer-Android/NetScope_v2.4.apk | awk '{print $1}' > WifiAnalyzer-Android/APK_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WifiAnalyzer-Android/NetScope_v2.4.apk WifiAnalyzer-Android/APK_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish NetScope v2.4 APK [skip ci]'
          git push
