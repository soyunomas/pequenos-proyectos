name: Build PDF Limpio

on:
  push:
    branches: [main]
    paths:
      - 'lector-pdf/**'
      - '.github/workflows/build-pdf-limpio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lector-pdf/**'
      - '.github/workflows/build-pdf-limpio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip pdf build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: lector-pdf
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK
        run: cp lector-pdf/app/build/outputs/apk/debug/app-debug.apk lector-pdf/PDF-Limpio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Limpio
          path: lector-pdf/PDF-Limpio.apk
      - name: Commit APK to main
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lector-pdf/PDF-Limpio.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build PDF Limpio APK [skip pdf build]'
          git push
