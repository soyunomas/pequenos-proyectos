name: Publish Flux Files source and APK

on:
  pull_request:
    paths:
      - '.github/workflows/build-flux-files-apk.yml'
      - 'flux-files-source.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9505177897/zip > flux-artifact.zip
          unzip flux-artifact.zip -d flux-artifact
          test -s flux-artifact/FluxFiles-v1.0.0.apk
          sha256sum -c flux-artifact/FluxFiles-v1.0.0.sha256

      - name: Prepare exact patched source
        run: |
          git clone --recurse-submodules https://github.com/zhanghai/MaterialFiles.git flux
          cd flux
          git checkout fc1250038496ebf4d4c139f62d16f0071f2c995a
          git submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          suffixes = {'.gradle', '.kts', '.kt', '.java', '.xml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              try:
                  lines = p.read_text().splitlines()
              except UnicodeDecodeError:
                  continue
              out, depth = [], 0
              for line in lines:
                  marker = line.strip()
                  if marker == '//#ifdef NONFREE':
                      depth += 1
                      continue
                  if marker == '//#endif' and depth:
                      depth -= 1
                      continue
                  if depth == 0:
                      out.append(line)
              if depth:
                  raise SystemExit(f'Unclosed NONFREE block in {p}')
              p.write_text('\n'.join(out) + '\n')
          PY
          rm -rf app/src/main/java/me/zhanghai/android/files/nonfree
          sed -i "s/applicationId 'me.zhanghai.android.files'/applicationId 'dev.local.fluxfiles'/" app/build.gradle
          sed -i "s/versionName '1.7.4'/versionName '1.7.4-flux.1'/" app/build.gradle
          sed -i "/repositories {/a\    maven { url uri(rootProject.file('local-maven')) }" app/build.gradle
          find app/src/main/res -name strings.xml -print0 | xargs -0 sed -i -E 's#<string name="app_name">[^<]*</string>#<string name="app_name">Flux Files</string>#g'
          cd ..

          git clone https://github.com/bitfireAT/dav4jvm.git dav4jvm
          cd dav4jvm
          git checkout 02fe1a95e6b86e323bec3784d7d2fe2d4081dde6
          cat >> build.gradle.kts <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions { moduleName.set("build") }
          }
          EOF

      - name: Create repository folder and READMEs
        run: |
          rm -rf FluxFiles-Android
          mkdir -p FluxFiles-Android/source FluxFiles-Android/third_party/dav4jvm
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='build' --exclude='local-maven' flux/ FluxFiles-Android/source/
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='build' dav4jvm/ FluxFiles-Android/third_party/dav4jvm/
          cp flux-artifact/FluxFiles-v1.0.0.apk FluxFiles-Android/
          cp flux-artifact/FluxFiles-v1.0.0.sha256 FluxFiles-Android/
          SHA256=$(cut -d' ' -f1 FluxFiles-Android/FluxFiles-v1.0.0.sha256)

          cat > FluxFiles-Android/build-from-source.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          DAV="$ROOT/third_party/dav4jvm"
          APP="$ROOT/source"
          (cd "$DAV" && GIT_COMMIT=02fe1a95e6 ./gradlew publish --stacktrace)
          rm -rf "$APP/local-maven"
          mkdir -p "$APP/local-maven"
          cp -R "$DAV/build/repo/"* "$APP/local-maven/"
          (cd "$APP" && ./gradlew assembleDebug lintVitalRelease --stacktrace)
          echo "APK: $APP/app/build/outputs/apk/debug/app-debug.apk"
          EOF
          chmod +x FluxFiles-Android/build-from-source.sh

          cat > FluxFiles-Android/README.md <<EOF
          # Flux Files para Android

          Gestor de archivos Android basado en **Material Files 1.7.4**, adaptado como **Flux Files**. Esta carpeta contiene el APK instalable y el código fuente correspondiente a la compilación validada por CI.

          ## Instalación

          - APK: [\`FluxFiles-v1.0.0.apk\`](./FluxFiles-v1.0.0.apk)
          - SHA-256: \`$SHA256\`
          - Paquete: \`dev.local.fluxfiles\`
          - Nombre: \`Flux Files\`
          - Versión: \`1.7.4-flux.1\`
          - Android mínimo: API 23 / Android 6.0

          El APK está firmado con la clave de depuración usada por CI; es válido para instalación manual, no como firma de publicación para Google Play.

          ## Contenido

          - \`source/\`: Material Files fijado al commit \`fc1250038496ebf4d4c139f62d16f0071f2c995a\` con los cambios de Flux Files aplicados.
          - \`third_party/dav4jvm/\`: dav4jvm fijado a \`02fe1a95e6b86e323bec3784d7d2fe2d4081dde6\` y ajustado para usar el módulo Kotlin \`build\`.
          - \`build-from-source.sh\`: recompila dav4jvm localmente y después la aplicación.
          - \`FluxFiles-v1.0.0.apk\`: APK previamente validado por CI.
          - \`FluxFiles-v1.0.0.sha256\`: hash para comprobar integridad.

          ## Compilar

          Requiere JDK 21 y Android SDK. Desde esta carpeta:

          \`\`\`bash
          ./build-from-source.sh
          \`\`\`

          El APK recompilado se genera en \`source/app/build/outputs/apk/debug/app-debug.apk\`.

          ## Modificaciones realizadas

          - \`applicationId\`: \`dev.local.fluxfiles\`.
          - Nombre visible: **Flux Files**.
          - \`versionName\`: \`1.7.4-flux.1\`.
          - Eliminación de bloques \`NONFREE\` y del código de Firebase/Crashlytics/Google Services.
          - Repositorio Maven local para dav4jvm.
          - dav4jvm fijado a la revisión exacta usada por el build y compilado con \`moduleName = build\` para conservar el ABI esperado.

          ## Licencias y procedencia

          \`source/\` deriva de [Material Files](https://github.com/zhanghai/MaterialFiles), publicado bajo **GPL-3.0**. Se conservan sus archivos de licencia y avisos. La dependencia [dav4jvm](https://github.com/bitfireAT/dav4jvm) se incluye en \`third_party/\` con sus avisos y licencia correspondientes.

          ## Validación del APK

          El APK aquí incluido procede del run que superó \`assembleDebug\`, \`lintVitalRelease\`, verificación con \`apksigner\` y comprobación de identidad de paquete/etiqueta.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          section = '''## 📱 Aplicaciones Android

          ### [📁 Flux Files](./FluxFiles-Android/)
          **Gestor de archivos Android basado en Material Files 1.7.4.**
          Incluye APK instalable, código fuente reproducible y documentación de los cambios realizados.
          *   **APK:** [FluxFiles-v1.0.0.apk](./FluxFiles-Android/FluxFiles-v1.0.0.apk)
          *   **Fuente y documentación:** [FluxFiles-Android](./FluxFiles-Android/)

          ---

          '''
          if './FluxFiles-Android/' not in text:
              marker = '## 🔌 Proyectos de Hardware y Sistemas'
              text = text.replace(marker, section + marker, 1) if marker in text else text + '\n\n' + section
              p.write_text(text)
          PY

      - name: Commit everything to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md FluxFiles-Android
          git rm .github/workflows/build-flux-files-apk.yml
          git commit -m 'feat: add Flux Files Android source and APK'
          git push origin main
