name: Build Flux Files APK

on:
  pull_request:
    paths:
      - '.github/workflows/build-flux-files-apk.yml'
      - 'flux-files-source.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out build recipe
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build exact dav4jvm revision locally
        run: |
          git clone https://github.com/bitfireAT/dav4jvm.git dav4jvm
          cd dav4jvm
          git checkout 02fe1a95e6b86e323bec3784d7d2fe2d4081dde6
          cat >> build.gradle.kts <<'EOF'

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  moduleName.set("build")
              }
          }
          EOF
          GIT_COMMIT=02fe1a95e6 ./gradlew publish --stacktrace
          test -f build/repo/com/github/bitfireAT/dav4jvm/02fe1a95e6/dav4jvm-02fe1a95e6.jar
          javap -classpath build/repo/com/github/bitfireAT/dav4jvm/02fe1a95e6/dav4jvm-02fe1a95e6.jar at.bitfire.dav4jvm.DavResource | grep -q 'followRedirects\$build'

      - name: Fetch pinned Material Files source
        run: |
          git clone --recurse-submodules https://github.com/zhanghai/MaterialFiles.git flux
          cd flux
          git checkout fc1250038496ebf4d4c139f62d16f0071f2c995a
          git submodule update --init --recursive
          mkdir -p local-maven
          cp -R ../dav4jvm/build/repo/* local-maven/

      - name: Apply reproducible FOSS branding patch
        run: |
          cd flux
          python3 - <<'PY'
          from pathlib import Path
          suffixes = {'.gradle', '.kts', '.kt', '.java', '.xml'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix not in suffixes:
                  continue
              try:
                  lines = p.read_text().splitlines()
              except UnicodeDecodeError:
                  continue
              out = []
              depth = 0
              changed = False
              for line in lines:
                  marker = line.strip()
                  if marker == '//#ifdef NONFREE':
                      depth += 1
                      changed = True
                      continue
                  if marker == '//#endif' and depth:
                      depth -= 1
                      changed = True
                      continue
                  if depth == 0:
                      out.append(line)
              if changed:
                  if depth:
                      raise SystemExit(f'Unclosed NONFREE block in {p}')
                  p.write_text('\n'.join(out) + '\n')
          PY
          rm -rf app/src/main/java/me/zhanghai/android/files/nonfree
          sed -i "s/applicationId 'me.zhanghai.android.files'/applicationId 'dev.local.fluxfiles'/" app/build.gradle
          sed -i "s/versionName '1.7.4'/versionName '1.7.4-flux.1'/" app/build.gradle
          sed -i "/repositories {/a\    maven { url uri(rootProject.file('local-maven')) }" app/build.gradle
          find app/src/main/res -name strings.xml -print0 | xargs -0 sed -i -E 's#<string name="app_name">[^<]*</string>#<string name="app_name">Flux Files</string>#g'
          grep -q "applicationId 'dev.local.fluxfiles'" app/build.gradle
          grep -q 'com.github.bitfireAT:dav4jvm:02fe1a95e6' app/build.gradle
          ! grep -R -q 'FirebaseCrashlytics\|google-services' app/src/main/java app/build.gradle
          grep -q '<string name="app_name">Flux Files</string>' app/src/main/res/values/strings.xml

      - name: Build and run release lint
        working-directory: flux
        run: ./gradlew assembleDebug lintVitalRelease --stacktrace

      - name: Verify APK signature and package identity
        run: |
          APK='flux/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='dev.local.fluxfiles'" apk-badging.txt
          grep -q "application-label:'Flux Files'" apk-badging.txt
          cp "$APK" FluxFiles-v1.0.0.apk
          sha256sum FluxFiles-v1.0.0.apk | tee FluxFiles-v1.0.0.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxFiles-v1.0.0
          path: |
            FluxFiles-v1.0.0.apk
            FluxFiles-v1.0.0.sha256
            apk-badging.txt
          if-no-files-found: error
          retention-days: 7
