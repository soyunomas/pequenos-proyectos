name: AndroWebSecure · unpack and build APK

on:
  push:
    branches: [main]
    paths:
      - 'AndroWebSecure/bootstrap/part-006.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore project sources and commit into main
        shell: bash
        run: |
          set -euo pipefail
          cat AndroWebSecure/bootstrap/part-*.b64 | base64 --decode > /tmp/androwebsecure.tar.xz
          echo '215b4de22cd26b6599e103febfd9f41fe356f59fc4853669b0abc710e24b6e26  /tmp/androwebsecure.tar.xz' | sha256sum -c -
          tar -xJf /tmp/androwebsecure.tar.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r AndroWebSecure/bootstrap
          git add -A AndroWebSecure
          git commit -m 'feat(androwebsecure): add full Android project and documentation [skip ci]'
          git push origin HEAD:main
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run HTTP core security tests
        run: bash AndroWebSecure/scripts/test-core.sh
      - name: Compile Android APK
        working-directory: AndroWebSecure
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK in main
        shell: bash
        run: |
          set -euo pipefail
          cp AndroWebSecure/app/build/outputs/apk/debug/app-debug.apk AndroWebSecure/AndroWebSecure-debug.apk
          sha256sum AndroWebSecure/AndroWebSecure-debug.apk | awk '{print $1}' > AndroWebSecure/APK-SHA256.txt
          git add -f AndroWebSecure/AndroWebSecure-debug.apk
          git add AndroWebSecure/APK-SHA256.txt
          git commit -m 'build(androwebsecure): publish debug APK [skip ci]'
          git push origin HEAD:main
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroWebSecure-debug-apk
          path: AndroWebSecure/AndroWebSecure-debug.apk
          if-no-files-found: error
