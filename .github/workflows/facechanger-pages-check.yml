name: FaceChanger Pages · pruebas
on:
  push:
    branches: [main]
    paths:
      - 'facechanger-pages/**'
      - '.github/workflows/facechanger-pages-check.yml'
  pull_request:
    paths:
      - 'facechanger-pages/**'
      - '.github/workflows/facechanger-pages-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript
        run: |
          for f in facechanger-pages/app.js facechanger-pages/engine/*.js facechanger-pages/tests/*.js facechanger-pages/tests/*.mjs; do
            node --check "$f"
          done
      - name: Geometría, inversión del ojo, filtros y persistencia
        run: node --test facechanger-pages/tests/logic.mjs
      - name: Instalar navegador solo para CI
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install chromium --with-deps
      - name: Interfaz adaptable, select y encuadre
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory facechanger-pages >/tmp/facechanger-pages-server.log 2>&1 &
          sleep 2
          node facechanger-pages/tests/ui.mjs
