name: netx one-shot gofmt

on:
  push:
    branches: [main]
    paths:
      - "REDES/netx/**"
      - ".github/workflows/netx-gofmt-once.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Apply canonical gofmt
        shell: bash
        run: |
          cd REDES/netx
          gofmt -w $(find . -name '*.go' -type f)
          cd ../..
          if git diff --quiet; then
            echo "No gofmt changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REDES/netx
          git commit -m "NetX: aplicar gofmt canónico"
          git push origin HEAD:main
