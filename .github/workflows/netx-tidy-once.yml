name: netx one-shot tidy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netx-tidy-once.yml"

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Canonical go mod tidy
        shell: bash
        run: |
          cd REDES/netx
          go mod tidy
          cd ../..
          if git diff --quiet -- REDES/netx/go.mod REDES/netx/go.sum; then
            echo "No module changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REDES/netx/go.mod REDES/netx/go.sum
          git commit -m "NetX: aplicar go mod tidy de Go 1.23"
          git push origin HEAD:main
