name: Build Horario Lectivo APK

on:
  pull_request:
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  push:
    branches: [main]
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK
        working-directory: HorarioLectivo-Android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify timetable rows and JSON backup
        run: |
          grep -Fq 'NIGHT="N"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'BETWEEN_NIGHT="EN"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'd.betweenNight=readShift' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'd.night=readShift' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'generateSlots(data,data.betweenNight)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleEngine.java
          grep -Fq 'generateSlots(data,data.night)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleEngine.java
          grep -Fq 'betweenCell()' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'betweenTimeCell' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'ENTRE TURNOS' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/HorarioWidgetProvider.java
          grep -Fq 'BACKUP_FORMAT="horario-lectivo-backup"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'exportBackup(Data data)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'importBackup(String raw)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'Exportar JSON' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'Importar JSON' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq '"subjects": []' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"assignments": []' HorarioLectivo-Android/horario_backup_template.json
          unzip -t HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload tested APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorarioLectivo-v1.21-debug
          path: HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          cp HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk HorarioLectivo-Android/HorarioLectivo_v1.21.apk
          sha256sum HorarioLectivo-Android/HorarioLectivo_v1.21.apk | awk '{print $1}' > HorarioLectivo-Android/APK_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HorarioLectivo-Android/HorarioLectivo_v1.21.apk HorarioLectivo-Android/APK_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish Horario Lectivo v1.21 APK [skip ci]'
          git push
