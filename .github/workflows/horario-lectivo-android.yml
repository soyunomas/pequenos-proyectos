name: Build Horario Lectivo APK

on:
  pull_request:
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  push:
    branches: [main]
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK
        working-directory: HorarioLectivo-Android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify timetable, classrooms and JSON backup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def has(path, *needles):
              text = Path(path).read_text(encoding="utf-8")
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f"{path}: missing {missing}")

          has("HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java",
              'NIGHT="N"', 'BETWEEN_NIGHT="EN"', 'defaultRoom', 'getRoomOverride', 'customSlots')
          has("HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java",
              'BACKUP_FORMAT="horario-lectivo-backup"', 'subjects[].defaultRoom',
              'assignments[].room', 'getRoomOverride', 'ensureSlotsForAssignments')
          has("HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java",
              'Exportar JSON', 'Importar JSON', 'Aula general', 'Guardar excepción',
              'Mostrar aula/lugar en el widget', 'verifyExportedFile')
          has("HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java",
              'showSubjectDetails', 'Aula general', 'Aula excepcional', 'OvershootInterpolator')
          has("HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/HorarioWidgetProvider.java",
              'roomFor(d,r)', 'ENTRE TURNOS')
          has("HorarioLectivo-Android/horario_backup_template.json",
              '"subjects": []', '"assignments": []', '"subjects[].defaultRoom"',
              '"assignments[].room"', '"assignmentWithRoomException"',
              '"shifts.*.slots"', '"exactSlotsWithFiveMinuteGap"')
          PY
          unzip -t HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload tested APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorarioLectivo-v1.26-debug
          path: HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          cp HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk HorarioLectivo-Android/HorarioLectivo_v1.26.apk
          sha256sum HorarioLectivo-Android/HorarioLectivo_v1.26.apk | awk '{print $1}' > HorarioLectivo-Android/APK_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HorarioLectivo-Android/HorarioLectivo_v1.26.apk HorarioLectivo-Android/APK_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish Horario Lectivo v1.26 APK [skip ci]'
          git push
