name: Build Horario Lectivo APK

on:
  pull_request:
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  push:
    branches: [main]
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK
        working-directory: HorarioLectivo-Android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify 4x2 and 4x1 widget compatibility
        run: |
          grep -q 'android:targetCellWidth="4"' HorarioLectivo-Android/app/src/main/res/xml/horario_widget_info.xml
          grep -q 'android:targetCellHeight="2"' HorarioLectivo-Android/app/src/main/res/xml/horario_widget_info.xml
          grep -q '<Chronometer android:id="@+id/next_countdown"' HorarioLectivo-Android/app/src/main/res/layout/widget_horario.xml
          grep -q '<Chronometer android:id="@+id/next_countdown"' HorarioLectivo-Android/app/src/main/res/layout/widget_horario_compact.xml
          unzip -t HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
      - name: Upload tested APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorarioLectivo-v1.8-debug
          path: HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          cp HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk HorarioLectivo-Android/HorarioLectivo_v1.8.apk
          sha256sum HorarioLectivo-Android/HorarioLectivo_v1.8.apk | awk '{print $1}' > HorarioLectivo-Android/APK_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HorarioLectivo-Android/HorarioLectivo_v1.8.apk HorarioLectivo-Android/APK_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish Horario Lectivo v1.8 APK [skip ci]'
          git push
