name: Build Horario Lectivo APK

on:
  pull_request:
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  push:
    branches: [main]
    paths:
      - 'HorarioLectivo-Android/**'
      - '.github/workflows/horario-lectivo-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK
        working-directory: HorarioLectivo-Android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify timetable rows and JSON backup
        run: |
          grep -Fq 'NIGHT="N"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'BETWEEN_NIGHT="EN"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'd.betweenNight=readShift' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'd.night=readShift' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'generateSlots(data,data.betweenNight)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleEngine.java
          grep -Fq 'generateSlots(data,data.night)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleEngine.java
          grep -Fq 'betweenCell()' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'betweenTimeCell' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'ENTRE TURNOS' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/HorarioWidgetProvider.java
          grep -Fq 'BACKUP_FORMAT="horario-lectivo-backup"' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'exportBackup(Data data)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'importBackup(String raw)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'Exportar JSON' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'Importar JSON' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq '"subjects": []' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"assignments": []' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"maxLength": 3' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"pattern": "^[A-Z0-9]{1,3}$"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"aiInstructions"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"fields"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"rules"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq 'contentState' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'maxLength",3' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'HorarioLectivo_plantilla_IA.json' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'pendingExportJson=repo.exportBackup(d)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'openFileDescriptor(uri,"rwt")' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'out.getFD().sync()' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'verifyExportedFile' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'public final Map<String,String> rooms' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'showRoomsInWidget' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'o.put("room",d.getRoomOverride' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'assignments[].room' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'Mostrar aula/lugar en el widget' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'editRoom(' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'roomFor(d,r)' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/HorarioWidgetProvider.java
          grep -Fq '"widget": {' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"assignments[].room"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"room": ""' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq 'customSlots' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'ensureSlotsForAssignments' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'shifts.*.slots' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq 'exactSlotsWithFiveMinuteGap' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq '"shifts.*.slots"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"exactSlotsWithFiveMinuteGap"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"end": "09:55"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq 'Franjas exactas importadas' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'defaultRoom' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'getRoomOverride' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'Aula general' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'Guardar excepción' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/SettingsActivity.java
          grep -Fq 'showSubjectDetails' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'subjects[].defaultRoom' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq '"subjects[].defaultRoom"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"assignmentWithRoomException"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq 'defaultRoom' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'getRoomOverride' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleModels.java
          grep -Fq 'Aula general' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'Aula excepcional' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'showSubjectDetails' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'OvershootInterpolator' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/MainActivity.java
          grep -Fq 'subjects[].defaultRoom' HorarioLectivo-Android/app/src/main/java/com/soyunomas/horariolectivo/ScheduleRepository.java
          grep -Fq '"subjects[].defaultRoom"' HorarioLectivo-Android/horario_backup_template.json
          grep -Fq '"assignmentWithRoomException"' HorarioLectivo-Android/horario_backup_template.json
          unzip -t HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload tested APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorarioLectivo-v1.26-debug
          path: HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in repository
        if: github.event_name == 'push'
        run: |
          cp HorarioLectivo-Android/app/build/outputs/apk/debug/app-debug.apk HorarioLectivo-Android/HorarioLectivo_v1.26.apk
          sha256sum HorarioLectivo-Android/HorarioLectivo_v1.26.apk | awk '{print $1}' > HorarioLectivo-Android/APK_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HorarioLectivo-Android/HorarioLectivo_v1.26.apk HorarioLectivo-Android/APK_SHA256.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish Horario Lectivo v1.26 APK [skip ci]'
          git push
