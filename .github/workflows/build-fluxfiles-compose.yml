name: Build Flux Files Compose

on:
  push:
    branches:
      - fluxfiles-compose-mvp
    paths:
      - 'FluxFiles-Compose/**'
      - '.github/workflows/build-fluxfiles-compose.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FluxFiles-Compose
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FluxFiles-Compose-0.1.0-debug
          path: FluxFiles-Compose/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
