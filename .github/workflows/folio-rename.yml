name: Apply Folio PDF rename

on:
  push:
    branches:
      - folio-pdf-rename

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: folio-pdf-rename
      - name: Apply application identity migration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d lector-pdf/app/src/main/java/com/soyunomas/pdflimpio ]; then
            echo 'Application identity already migrated.'
            exit 0
          fi
          mkdir -p lector-pdf/app/src/main/java/com/soyunomas/foliopdf
          mv lector-pdf/app/src/main/java/com/soyunomas/pdflimpio/*.java lector-pdf/app/src/main/java/com/soyunomas/foliopdf/
          rmdir lector-pdf/app/src/main/java/com/soyunomas/pdflimpio
          rm -f lector-pdf/PDF-Limpio.apk
          find lector-pdf -type f \( -name '*.java' -o -name '*.xml' -o -name '*.gradle' -o -name '*.md' -o -name '*.properties' -o -name '*.txt' \) -print0 | xargs -0 perl -pi -e 's/com\.soyunomas\.pdflimpio/com.soyunomas.foliopdf/g; s/PDF Limpio/Folio PDF/g; s/PDFLimpio/FolioPDF/g; s/PDF-Limpio/Folio-PDF/g; s/pdf-limpio/folio-pdf/g'
          perl -pi -e "s/versionCode\s+\d+/versionCode 9/; s/versionName\s+'[^']+'/versionName '1.3.0'/" lector-pdf/app/build.gradle
          perl -0pi -e 's#<string name="empty_title">.*?</string>#<string name="empty_title">Abre un documento</string>#s; s#<string name="empty_body">.*?</string>#<string name="empty_body">Lee, busca, copia texto y rellena formularios PDF.</string>#s' lector-pdf/app/src/main/res/values/strings.xml
          if grep -RInE 'PDF[ -]?Limpio|PDFLimpio|pdflimpio|pdf-limpio' lector-pdf; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A lector-pdf
          git commit -m 'refactor: adopt Folio PDF identity'
          git push origin folio-pdf-rename
